name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Core on macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools (CI runner only)
        run: |
          brew install clang-format llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - run: make format-check
      - run: make lint
      - run: make analyze
      - run: make test
      - run: make test-asan
      - run: make test-tsan
      - run: make check-rt
      - run: make bench
      - run: make tools
      - run: make bootstrap
      - run: make test-py

  linux:
    name: Portable core on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make test CC=gcc
      - run: make test-tsan CC=clang
